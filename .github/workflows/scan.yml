name: scan

on:
  schedule:
    - cron: "3 * * * *"        # 3 minutes past EVERY hour (UTC); GitHub may delay it by 5-30 min
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: diagnose
        options:
          - diagnose
          - scan-dry-run
          - scan

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py "${INPUT_MODE:-scan}"

      - name: Save state and scan log
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan state [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push failed (will retry next run)"
          fi
