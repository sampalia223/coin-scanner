name: backtest

on:
  workflow_dispatch:      # manual only: run it when you want a fresh hit-rate report (takes about 15 minutes)

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Replay the scanner over the last ~45 days and measure hit rates
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py backtest

      - name: Save summary
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "backtest summary [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push failed (will retry next run)"
          fi
