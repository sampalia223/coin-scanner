name: universe

on:
  schedule:
    - cron: "30 18 * * *"      # once a day (about 5:30am Sydney)
  workflow_dispatch:
    inputs:
      mode:
        description: "Which refresh"
        type: choice
        default: universe-auto
        options:
          - universe-auto      # quick one day, full the next (every 48 hours)
          - universe           # force a full rebuild (about 25 min)
          - universe-quick     # force a quick refresh (about 5 min)

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh coin list (quick one day, full the next)
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py "${INPUT_MODE:-universe-auto}"

      - name: Save coin list
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "update coin list [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push failed (will retry next run)"
          fi
